# TIER 1 HybridIQL hyperparameters
state_dim: 12
action_dim: 125
hidden_dim: 256
gamma: 0.99
tau: 0.8          # expectile
beta: 2.0         # advantage temperature
lr: 3.0e-4
batch_size: 256
total_steps: 100000
# 500, not 10000. Measured 2026-10-07 (benchmark/results/checkpoint_granularity_track_a.json):
# every one of 5 seeds has its validation optimum near step 5,750, which a 10,000-step
# interval cannot see — it simply never looks there. All 5 seeds under the old setting
# selected step 10,000, the FIRST checkpoint evaluated, which is the signature of an
# interval too coarse to locate the minimum rather than of a genuine optimum. Finer
# checkpointing lowers best val_q from 1.5340 [1.5135, 1.5545] to 1.4802 [1.4740,
# 1.4864] — non-overlapping CIs. Costs nothing: validation is cheap relative to a
# training step, and every seed early-stops by 14,000 anyway.
checkpoint_every: 500
early_stop_patience: 20000

reward:
  C1: 1.0
  C2: 0.5
  lam1: 0.3
  # Action-causal bonus (§14.4 fix). Operating point chosen by a HOLISTIC probe
  # (backend/scripts/probe_operating_point.py) across a clinically diverse battery,
  # not just the 3 seed tests. lam_causal=2.0 with alpha=0.5 is the balanced sweet
  # spot: it passes all three §14.1 acceptance states (hypoxaemia→PEEP+2,
  # hyperoxia→FiO2-0.10, hypercapnia→TV+25) AND keeps correct safety/settings
  # behaviour (high PEEP→lower, volutrauma→cut TV, low PEEP→raise) AND HOLDS when
  # stable (37 distinct actions, hold 0.68). Above ~2.5 the policy degenerates into
  # "always raise FiO2" and ignores PEEP/TV safety; below ~2.0 it under-reacts to
  # borderline physiology. See SUMMARY §7/§14.
  lam_causal: 2.0
  # Terminal outcome reward = mortality + ventilator-free days (reward.outcome_reward),
  # attached at each episode's last transition. w_outcome scales the unit term
  # (~[-1, +1]); 0.0 = DISABLED (default — the trained checkpoints used 0). Enabling
  # changes the reward, so it requires: rebuild dataset (python -m backend.mdp.dataset)
  # → retrain → verify_before_deploy. outcome_horizon_days sets the VFD/mortality window.
  w_outcome: 0.25
  outcome_horizon_days: 28

cql:
  alpha: 0.5   # conservatism weight in the HybridIQL Q-loss (keeps argmax in-distribution)

# Inverse-propensity weighting for confounding-by-indication (§16 item 8). When
# enabled, transitions are reweighted by stabilised IPW (p(a)/π_β(a|s)) so the
# frequently-taken, severity-confounded actions are down-weighted during training.
# DEFAULT false — the deployed checkpoints train without it; enabling changes the
# policy, so it requires retrain → verify_before_deploy. This is a partial
# correction for *measured* confounding, not a cure for unmeasured confounders.
ipw:
  enabled: false

# Time-varying propensity z_t = P(SpO2<88 in next 6h | state) for the §10.4 OPE
# ablation (backend/pipeline/propensity_dynamic.py). Evaluation-only: it is never
# used by the deployed policy or reward. dynamic_zt gates ONLY the opt-in
# materialisation of a `propensity_zt` MDP column (propensity_z is left untouched);
# DEFAULT false so the processed parquet and the static OPE path stay byte-for-byte
# identical. The ablation script computes z_t on the fly regardless of this flag.
propensity:
  dynamic_zt: false

# Blood-gas (PaO2/PaCO2/pH) GP imputation method (§3). 'matern' = independent
# per-signal Matérn-3/2 GP (default, deployed). 'lmc' = multi-output intrinsic
# coregionalization GP (backend/pipeline/gp_lmc.py) that imputes the correlated
# labs JOINTLY. 'lmc' changes the imputed states → MDP → policy, so switching it on
# requires a full rebuild → retrain → verify_before_deploy via run_track_a_pipeline.
imputation:
  method: matern
