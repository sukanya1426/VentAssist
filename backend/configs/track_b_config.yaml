# TIER 2 HybridIQL hyperparameters
state_dim: 18
action_dim: 125
hidden_dim: 256
gamma: 0.99
tau: 0.8
beta: 2.0
lr: 3.0e-4
batch_size: 256
total_steps: 100000
checkpoint_every: 10000
early_stop_patience: 20000

reward:
  C1: 1.0
  C2: 0.5
  lam1: 0.3
  lam2: 0.2
  lam3: 0.15
  lam_causal: 0.4   # action-causal bonus (§14.4 fix); sweep [0.2, 0.4, 0.6, 0.8]
  # Terminal outcome reward (mortality + VFD); 0.0 = DISABLED (default). See
  # track_a_config.yaml for the enable procedure (rebuild → retrain → verify).
  w_outcome: 0.0
  outcome_horizon_days: 28

cql:
  alpha: 0.5   # conservatism weight in the HybridIQL Q-loss (keeps argmax in-distribution)
